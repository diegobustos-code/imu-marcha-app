name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Compilar
        run: gradle --no-daemon assembleDebug
      - name: Renombrar
        run: cp app/build/outputs/apk/debug/app-debug.apk IMU_Marcha.apk
      - uses: actions/upload-artifact@v4
        with:
          name: IMU_Marcha
          path: IMU_Marcha.apk
      - name: Publicar en Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: IMU Marcha (versión ${{ github.run_number }})
          body: APK compilada automáticamente desde ${{ github.sha }}. Descárgala desde el teléfono e instálala.
          files: IMU_Marcha.apk
          make_latest: true
